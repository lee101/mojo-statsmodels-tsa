[project]
name = "mojo-statsmodels-tsa"
version = "0.1.0"
description = "Classical time-series decomposition and tests accelerated by Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
dev = ["pandas", "pytest", "statsmodels"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
